name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: ./test.sh
      - name: Build
        run: swiftc -O -swift-version 5 -target arm64-apple-macos14 -o Muster Sources/*.swift
