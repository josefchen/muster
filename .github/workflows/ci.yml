name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prebuilt_run:
        description: 'Diagnose Intel startup using the e2e artifact from this run ID (leave empty for full CI)'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
env:
  MUSTER_E2E_DIAGNOSTICS: ${{ github.workspace }}/e2e-diagnostics
jobs:
  build:
    if: ${{ !inputs.prebuilt_run }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Test
        run: ./test.sh
      - name: Build
        run: swiftc -O -swift-version 5 -target arm64-apple-macos14 -o Muster Sources/*.swift
      - name: End-to-end
        run: scripts/e2e.sh
      - name: Soak
        run: scripts/e2e.sh --soak 2
        env:
          MUSTER_SOAK_CPU_LIMIT: "3"
      # Only macOS 26's SDK compiles Muster (it uses Liquid Glass when it's there), so the
      # other Macs below test this one universal build rather than building their own.
      - name: Build for other Macs
        run: scripts/e2e.sh --export dist && tar -czf e2e.tgz dist
      - uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: e2e.tgz
          retention-days: 3
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-build
          path: e2e-diagnostics
          retention-days: 3

  diagnose-intel:
    if: ${{ inputs.prebuilt_run != '' && inputs.prebuilt_run != null }}
    runs-on: macos-26-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: e2e
          run-id: ${{ inputs.prebuilt_run }}
          github-token: ${{ github.token }}
      - name: Verify the app matches, then rebuild the diagnostic driver
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.prebuilt_run }}
        run: |
          source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          git diff --exit-code "$source_sha" -- Sources Resources CHANGELOG.md
          tar -xzf e2e.tgz
          swiftc -O -swift-version 5 -target x86_64-apple-macos14 -o dist/driver Tests/e2e/*.swift
      - name: End-to-end
        run: scripts/e2e.sh --prebuilt dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-intel
          path: e2e-diagnostics
          retention-days: 3

  website:
    if: ${{ !inputs.prebuilt_run }}
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Privacy and aggregate-counter tests
        run: node --test site/tests/*.test.js
      - name: Build the complete site
        run: scripts/site.sh
      - name: Validate Worker types and deployment
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          npx --yes wrangler@4.151.0 types --config site/wrangler.jsonc site/worker-configuration.d.ts
          npx --yes --package typescript@5.9.3 tsc -p site/tsconfig.json
          npx --yes wrangler@4.151.0 deploy --dry-run --config site/wrangler.jsonc

  # The same suite on every macOS Muster supports, on Apple silicon and on Intel.
  other-macs:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15, macos-15-intel, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: e2e
      - name: End-to-end
        run: tar -xzf e2e.tgz && scripts/e2e.sh --prebuilt dist
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.os }}
          path: e2e-diagnostics
          retention-days: 3
      # The suite runs headless; these show what the panels look like on this Mac.
      - name: Screenshots
        if: always()
        run: |
          app=dist/MusterE2E.app/Contents/MacOS/MusterE2E
          mkdir -p shots
          shot() { name=$1; shift; "$app" "$@" >/dev/null 2>&1 & pid=$!; sleep 5; screencapture -x "shots/$name.png" || true; kill $pid; sleep 1; }
          for look in dark light; do
            flag=""; [ "$look" = light ] && flag=--light
            shot "alert-$look" --demo --backdrop --attention --question --peek $flag
            shot "switcher-$look" --demo --backdrop --switcher $flag
            shot "tour-$look" --demo --backdrop --welcome --step 3 -launched NO $flag
          done
          ls -la shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shots-${{ matrix.os }}
          path: shots
          retention-days: 3
