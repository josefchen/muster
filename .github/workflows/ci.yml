name: Directory screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Test the app
        run: ./test.sh
      - name: Build the real app
        run: ./build.sh "$RUNNER_TEMP/Muster.app"
      - name: Capture real app with the menu bar visible
        shell: bash
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Muster.app/Contents/MacOS/Muster"
          mkdir -p shots
          pkill -x Muster || true
          sleep 2
          shot() {
            local name="$1"
            shift
            "$app" --demo "$@" -launched YES >"shots/$name.log" 2>&1 &
            local pid=$!
            sleep 6
            kill -0 "$pid"
            screencapture -x "shots/$name.png"
            kill "$pid"
            wait "$pid" || true
            sleep 2
          }
          shot answer-details --attention --question --peek
          shot session-switcher --switcher
          shot session-search --search
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: muster-directory-screenshots
          path: shots
          retention-days: 14
